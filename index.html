<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON VORTEX</title>
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Vortex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#03050c;color:#e0f7ff;font-family:Orbitron,'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none}
  
  /* ===== LOADING SCREEN ===== */
  #loader{
    position:fixed;inset:0;background:#03050c;z-index:9999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .6s ease,visibility .6s;
  }
  #loader.hide{opacity:0;visibility:hidden;pointer-events:none}
  #loader canvas{position:absolute;inset:0;width:100%;height:100%}
  .loader-content{position:relative;z-index:2;text-align:center;padding:20px}
  .loader-logo{
    font-size:clamp(28px,8vw,42px);font-weight:900;letter-spacing:4px;
    background:linear-gradient(90deg,#00f0ff,#ff2d9b,#00f0ff);background-size:200% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:shine 3s linear infinite,pulse 2s ease-in-out infinite;
    margin-bottom:28px;text-shadow:0 0 30px rgba(0,240,255,.3);
  }
  @keyframes shine{to{background-position:200% center}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .loader-bar-wrap{
    width:min(280px,70vw);height:6px;background:#0a1a28;border-radius:10px;
    overflow:hidden;margin:0 auto 16px;border:1px solid #0a3a4a;
  }
  .loader-bar{
    height:100%;width:0%;background:linear-gradient(90deg,#00e5ff,#ff2d9b);
    border-radius:10px;transition:width .15s ease;box-shadow:0 0 12px rgba(0,229,255,.5);
  }
  .loader-pct{font-size:14px;color:#7ec8e8;margin-bottom:22px;letter-spacing:1px}
  .loader-dev{
    font-size:14px;color:#5a9ab8;letter-spacing:2px;opacity:0;
    transition:opacity 1.2s ease; margin-top:6px;
  }
  .loader-dev.show{opacity:1}
  .loader-dev b{color:#00e5ff; font-size:15px}
  .loader-tip{
    margin-top:18px; font-size:12px; color:#4a7a98; letter-spacing:1px;
    opacity:0; transition:opacity 1.4s ease;
  }
  .loader-tip.show{opacity:1}

  /* ===== GAME UI ===== */
  #wrap{width:min(96vw,420px);height:100dvh;display:flex;flex-direction:column;padding:4px 0 6px;gap:3px;opacity:0;transition:opacity .5s}
  #wrap.show{opacity:1}
  header{text-align:center;padding:1px 0;position:relative}
  h1{font-size:clamp(20px,5.5vw,30px);font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#00f0ff,#ff2d9b,#00f0ff);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3.5s linear infinite}
  #muteBtn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:#0b2535;border:1px solid #00c8e8;color:#8ad8ff;
    width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  #hud{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2px;font-size:11px;padding:0 6px;color:#7ec8e8}
  #hud b{color:#fff;font-weight:700}
  #hud .combo{color:#ff9;grid-column:1/-1;text-align:center;min-height:14px;font-size:12px}
  canvas#c{display:block;width:100%;height:auto;max-height:calc(100dvh - 215px);border:2px solid #00d4ff;border-radius:12px;background:#070b16;box-shadow:0 0 28px rgba(0,200,255,.18),inset 0 0 50px rgba(0,80,140,.08);touch-action:none}
  #controls{display:grid;grid-template-columns:1fr 1.7fr 1fr;grid-template-rows:auto auto;gap:6px;padding:0 4px}
  button{padding:14px 4px;min-height:52px;border-radius:12px;border:1px solid #00c8e8;background:linear-gradient(180deg,#0b2535,#06141f);color:#d8f4ff;font-family:inherit;font-weight:700;font-size:13px;letter-spacing:.4px;cursor:pointer;touch-action:manipulation;transition:all .1s;user-select:none}
  button:active,button.active{background:linear-gradient(180deg,#00b8d4,#007a99);color:#001018;transform:scale(.96);box-shadow:0 0 14px rgba(0,200,255,.45)}
  #btn-fire{background:linear-gradient(180deg,#3a0d28,#1a0714);border-color:#ff2d6a;font-size:15px;letter-spacing:1px}
  #btn-fire:active,#btn-fire.active{background:linear-gradient(180deg,#ff2d6a,#b01040);color:#fff;box-shadow:0 0 18px rgba(255,45,106,.55)}
  #btn-pause{grid-column:1/2;font-size:12px;min-height:44px;opacity:.9}
  #btn-start{grid-column:2/4;background:linear-gradient(90deg,#002433,#003348);border-color:#00d4ff;font-size:14px;letter-spacing:1.5px;min-height:44px}
  #msg{text-align:center;font-size:11px;color:#6aa8c8;min-height:16px;padding:0 6px}
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loader">
  <canvas id="loadCanvas"></canvas>
  <div class="loader-content">
    <div class="loader-logo">NEON VORTEX</div>
    <div class="loader-bar-wrap"><div class="loader-bar" id="loadBar"></div></div>
    <div class="loader-pct" id="loadPct">0%</div>
    <div class="loader-dev" id="loadDev">Developed by <b>RV7</b></div>
    <div class="loader-tip" id="loadTip">Ambil orb hijau untuk menambah nyawa</div>
  </div>
</div>

<div id="wrap">
  <header>
    <h1>NEON VORTEX</h1>
    <button id="muteBtn" title="Mute / Unmute">🔊</button>
  </header>
  <div id="hud">
    <span>SKOR <b id="score">0</b></span>
    <span>NYAWA <b id="lives">3</b></span>
    <span>LV <b id="level">1</b></span>
    <span>HS <b id="hs">0</b></span>
    <div class="combo" id="combo"></div>
  </div>
  <canvas id="c" width="360" height="540"></canvas>
  <div id="controls">
    <button id="btn-left">◀ KIRI</button>
    <button id="btn-fire">TEMBAK</button>
    <button id="btn-right">KANAN ▶</button>
    <button id="btn-pause">JEDA</button>
    <button id="btn-start">MULAI / ULANG</button>
  </div>
  <p id="msg">Tembak • Ambil orb • Hindari tabrakan • Kumpulkan combo!</p>
</div>

<script>
// ===================== LOADING SCREEN =====================
const loadCanvas = document.getElementById('loadCanvas');
const lctx = loadCanvas.getContext('2d');
let loadParts = [];
let loadProgress = 0;
let loadDone = false;

function resizeLoader(){
  loadCanvas.width = window.innerWidth;
  loadCanvas.height = window.innerHeight;
}
resizeLoader();
window.addEventListener('resize', resizeLoader);

for(let i=0;i<140;i++){
  loadParts.push({
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    r: 0.5 + Math.random()*2.8,
    vx: (Math.random()-0.5)*1.4,
    vy: (Math.random()-0.5)*1.4,
    a: 0.15 + Math.random()*0.7,
    hue: Math.random() > 0.55 ? 190 : (Math.random() > 0.5 ? 320 : 280),
    pulse: Math.random() * Math.PI * 2
  });
}

function drawLoader(){
  if(loadDone) return;
  lctx.fillStyle = 'rgba(3,5,12,0.22)';
  lctx.fillRect(0,0,loadCanvas.width,loadCanvas.height);
  
  const time = performance.now() / 1000;
  loadParts.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.pulse += 0.04;
    if(p.x < 0 || p.x > loadCanvas.width) p.vx *= -1;
    if(p.y < 0 || p.y > loadCanvas.height) p.vy *= -1;
    
    const pulseSize = p.r * (0.85 + Math.sin(p.pulse) * 0.25);
    const alpha = p.a * (0.7 + Math.sin(p.pulse * 0.7) * 0.3);
    
    lctx.beginPath();
    lctx.arc(p.x, p.y, pulseSize, 0, Math.PI*2);
    lctx.fillStyle = `hsla(${p.hue},100%,68%,${alpha})`;
    lctx.fill();
    
    // soft glow
    if(p.r > 1.6){
      lctx.beginPath();
      lctx.arc(p.x, p.y, pulseSize * 2.2, 0, Math.PI*2);
      lctx.fillStyle = `hsla(${p.hue},100%,60%,${alpha * 0.12})`;
      lctx.fill();
    }
  });
  requestAnimationFrame(drawLoader);
}
drawLoader();

function runLoading(){
  const bar = document.getElementById('loadBar');
  const pct = document.getElementById('loadPct');
  const dev = document.getElementById('loadDev');
  let start = performance.now();
  const duration = 5200; // lebih lama biar sempat dibaca
  
  function tick(now){
    const t = Math.min(1, (now - start) / duration);
    // smooth ease
    const ease = 1 - Math.pow(1 - t, 2.1);
    loadProgress = Math.floor(ease * 100);
    bar.style.width = loadProgress + '%';
    pct.textContent = loadProgress + '%';
    
    if(loadProgress >= 28) dev.classList.add('show');
    if(loadProgress >= 55) document.getElementById('loadTip').classList.add('show');
    
    if(t < 1){
      requestAnimationFrame(tick);
    } else {
      // kasih jeda ekstra biar sempat dibaca
      setTimeout(()=>{
        document.getElementById('loader').classList.add('hide');
        document.getElementById('wrap').classList.add('show');
        loadDone = true;
      }, 1100);
    }
  }
  requestAnimationFrame(tick);
}
runLoading();

// ===================== GAME =====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 360, H = 540;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const hsEl = document.getElementById('hs');
const comboEl = document.getElementById('combo');
const msgEl = document.getElementById('msg');
const muteBtn = document.getElementById('muteBtn');

// ===== AUDIO =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
let muted = false;

function ensureAudio(){
  if(!actx) actx = new AudioCtx();
  if(actx.state === 'suspended') actx.resume();
}

function beep(freq, dur, type='square', vol=0.12, slide=0){
  if(muted || !actx) return;
  try{
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if(slide) o.frequency.linearRampToValueAtTime(freq + slide, actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

function sfx(name){
  if(muted) return;
  ensureAudio();
  if(name==='shoot'){ beep(720,0.07,'square',0.09,180); }
  else if(name==='hit'){ beep(200,0.09,'sawtooth',0.1,-90); }
  else if(name==='explode'){ beep(140,0.22,'sawtooth',0.12,-110); setTimeout(()=>beep(90,0.2,'triangle',0.07,-50),40); }
  else if(name==='orb'){ beep(560,0.14,'sine',0.1,280); }
  else if(name==='power'){ beep(420,0.16,'square',0.11,480); }
  else if(name==='life'){ beep(380,0.12,'sine',0.11); setTimeout(()=>beep(520,0.15,'sine',0.1),90); }
  else if(name==='level'){ beep(320,0.1,'square',0.09); setTimeout(()=>beep(480,0.12,'square',0.09),70); setTimeout(()=>beep(640,0.18,'square',0.1),140); }
  else if(name==='hurt'){ beep(100,0.28,'sawtooth',0.13,-60); }
  else if(name==='over'){ beep(220,0.32,'sawtooth',0.12,-160); setTimeout(()=>beep(110,0.4,'triangle',0.09,-70),180); }
}

muteBtn.onclick = ()=>{
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if(!muted) ensureAudio();
};

// ===== STATE =====
let state = 'menu', score = 0, lives = 3, level = 1;
let highScore = +localStorage.getItem('nvHS2') || 0;
let isNewRecord = false;
hsEl.textContent = highScore;

let player = {x:W/2, y:H-55, w:26, h:30, speed:300, cooldown:0, shield:0, rapid:0, multi:0};
let bullets = [], enemies = [], orbs = [], particles = [], stars = [], floatTexts = [];
let keys = {left:0, right:0, fire:0};
let lastTime = 0, spawnTimer = 0, invuln = 0, shake = 0, combo = 0, comboTimer = 0, waveAnnounce = 0;

for(let i=0;i<70;i++){
  stars.push({x:Math.random()*W, y:Math.random()*H, s:0.4+Math.random()*1.6, sp:18+Math.random()*55, a:0.25+Math.random()*0.5});
}

function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function hit(a,b){ return Math.abs(a.x-b.x) < (a.w+b.w)/2 && Math.abs(a.y-b.y) < (a.h+b.h)/2; }

function spawnPart(x,y,color,n=10,spd=130,size=3){
  for(let i=0;i<n;i++){
    const ang = Math.random()*Math.PI*2, sp = rand(spd*0.25, spd);
    particles.push({x,y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:rand(0.25,0.7), max:0.7, color, size:rand(size*0.6,size)});
  }
}
function floatText(x,y,txt,color='#fff'){ floatTexts.push({x,y,txt,color,life:0.9,vy:-40}); }

function reset(){
  ensureAudio();
  score=0; lives=3; level=1; combo=0; comboTimer=0; isNewRecord=false;
  player = {x:W/2, y:H-55, w:26, h:30, speed:300, cooldown:0, shield:0, rapid:0, multi:0};
  bullets=[]; enemies=[]; orbs=[]; particles=[]; floatTexts=[];
  invuln=0; shake=0; spawnTimer=0.6; waveAnnounce=0;
  state='play';
  updateHUD();
  msgEl.textContent = 'Hancurkan musuh • Ambil power-up • Jaga combo!';
}

function updateHUD(){
  scoreEl.textContent = Math.floor(score);
  livesEl.textContent = lives + (player.shield > 0 ? ' +🛡' : '');
  levelEl.textContent = level;
  if(score > highScore){
    highScore = Math.floor(score);
    localStorage.setItem('nvHS2', highScore);
    hsEl.textContent = highScore;
    isNewRecord = true;
  }
  if(combo >= 3) comboEl.textContent = `COMBO x${combo} !`;
  else comboEl.textContent = '';
}

function spawnEnemy(){
  const r = Math.random();
  let e;
  if(r < 0.60){
    e = {x:rand(28,W-28), y:-28, w:24+rand(0,10), h:22+rand(0,8), vy:75+level*11+rand(0,35), vx:rand(-25,25), hp:1, maxHp:1, type:'normal'};
  } else if(r < 0.80){
    e = {x:rand(35,W-35), y:-22, w:18, h:18, vy:150+level*16, vx:rand(70,120)*(Math.random()<0.5?1:-1), hp:1, maxHp:1, type:'zig'};
  } else if(r < 0.92){
    e = {x:rand(40,W-40), y:-38, w:36, h:32, vy:48+level*5, vx:0, hp:3+Math.floor(level/4), maxHp:3+Math.floor(level/4), type:'tank'};
  } else {
    e = {x:rand(40,W-40), y:-30, w:28, h:24, vy:55+level*6, vx:rand(-40,40), hp:2, maxHp:2, type:'shooter', shootCd:rand(1.2,2.2)};
  }
  enemies.push(e);
}

function fire(){
  if(player.cooldown > 0) return;
  const rapid = player.rapid > 0;
  const multi = player.multi > 0 || level >= 4;
  bullets.push({x:player.x, y:player.y-16, w:4, h:13, vy:-540, dmg:1});
  if(multi){
    bullets.push({x:player.x-13, y:player.y-8, w:3, h:10, vy:-500, dmg:1});
    bullets.push({x:player.x+13, y:player.y-8, w:3, h:10, vy:-500, dmg:1});
  }
  if(level >= 7){
    bullets.push({x:player.x-22, y:player.y-2, w:3, h:8, vy:-460, dmg:1});
    bullets.push({x:player.x+22, y:player.y-2, w:3, h:8, vy:-460, dmg:1});
  }
  player.cooldown = rapid ? 0.09 : (level >= 6 ? 0.13 : 0.17);
  spawnPart(player.x, player.y-18, '#00e8ff', 3, 50, 2);
  sfx('shoot');
}

function dropOrb(x, y){
  const r = Math.random();
  let type = 'score';
  // Increased chance for life orb
  if(r < 0.18) type = 'life';
  else if(r < 0.30) type = 'shield';
  else if(r < 0.42) type = 'rapid';
  else if(r < 0.54) type = 'multi';
  orbs.push({x, y, w:16, h:16, vy:65, type, life:9});
}

// ===== UPDATE =====
function update(dt){
  if(state !== 'play') return;

  stars.forEach(s=>{
    s.y += s.sp * dt * (0.55 + level*0.07);
    if(s.y > H){ s.y = 0; s.x = Math.random()*W; }
  });

  let mx = 0;
  if(keys.left) mx -= 1;
  if(keys.right) mx += 1;
  player.x += mx * player.speed * dt;
  player.x = clamp(player.x, 18, W-18);
  if(keys.fire) fire();
  player.cooldown = Math.max(0, player.cooldown - dt);
  invuln = Math.max(0, invuln - dt);
  shake = Math.max(0, shake - dt*9);
  player.shield = Math.max(0, player.shield - dt);
  player.rapid = Math.max(0, player.rapid - dt);
  player.multi = Math.max(0, player.multi - dt);
  comboTimer = Math.max(0, comboTimer - dt);
  if(comboTimer <= 0) combo = 0;
  waveAnnounce = Math.max(0, waveAnnounce - dt);

  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnEnemy();
    const base = Math.max(0.28, 0.95 - level*0.065);
    spawnTimer = base + rand(0, 0.35);
  }

  for(let i = bullets.length-1; i >= 0; i--){
    const b = bullets[i];
    b.y += b.vy * dt;
    if(b.y < -20) bullets.splice(i, 1);
  }

  for(let i = enemies.length-1; i >= 0; i--){
    const e = enemies[i];
    e.y += e.vy * dt;
    e.x += e.vx * dt;
    if(e.type === 'zig' && (e.x < 18 || e.x > W-18)) e.vx *= -1;
    if(e.type === 'shooter'){
      e.shootCd -= dt;
      if(e.shootCd <= 0 && e.y > 20 && e.y < H*0.7){
        enemies.push({x:e.x, y:e.y+12, w:8, h:10, vy:180+level*10, vx:0, hp:1, maxHp:1, type:'ebullet'});
        e.shootCd = rand(1.4, 2.4);
      }
    }

    for(let j = bullets.length-1; j >= 0; j--){
      if(e.type === 'ebullet') continue;
      if(hit(bullets[j], e)){
        bullets.splice(j, 1);
        e.hp -= 1;
        spawnPart(e.x, e.y, '#ff5577', 5, 90, 2.5);
        sfx('hit');
        if(e.hp <= 0){
          const basePts = e.type==='tank' ? 90 : e.type==='zig' ? 50 : e.type==='shooter' ? 70 : 28;
          const pts = Math.floor(basePts * (1 + level*0.12) * (1 + combo*0.08));
          score += pts;
          combo = Math.min(combo+1, 25);
          comboTimer = 2.2;
          spawnPart(e.x, e.y, e.type==='tank' ? '#ff99bb' : '#ff4466', 16, 170, 3.5);
          floatText(e.x, e.y-10, '+'+pts, combo>=5 ? '#ffee55' : '#fff');
          sfx('explode');
          if(Math.random() < 0.38 || e.type === 'tank') dropOrb(e.x, e.y);
          enemies.splice(i, 1);
          updateHUD();
        }
        break;
      }
    }

    if(invuln <= 0 && hit(player, e)){
      if(e.type === 'ebullet') enemies.splice(i, 1);
      else enemies.splice(i, 1);

      if(player.shield > 0){
        player.shield = 0;
        invuln = 0.8;
        spawnPart(player.x, player.y, '#88eeff', 14, 140);
        sfx('power');
        floatText(player.x, player.y-20, 'SHIELD!', '#88eeff');
      } else {
        lives--;
        invuln = 1.5;
        shake = 0.55;
        combo = 0;
        spawnPart(player.x, player.y, '#00e5ff', 22, 190, 4);
        sfx('hurt');
        if(lives <= 0){
          state = 'over';
          sfx('over');
          msgEl.textContent = 'GAME OVER — Skor: ' + Math.floor(score) + (isNewRecord ? ' ★ REKOR BARU!' : '');
        }
      }
      updateHUD();
    }

    if(e.y > H + 50){
      enemies.splice(i, 1);
      if(e.type !== 'ebullet') score = Math.max(0, score - 12);
    }
  }

  for(let i = orbs.length-1; i >= 0; i--){
    const o = orbs[i];
    o.y += o.vy * dt;
    o.life -= dt;
    if(hit(player, o)){
      orbs.splice(i, 1);
      if(o.type === 'score'){
        score += 70;
        floatText(o.x, o.y, '+70', '#8cf');
        sfx('orb');
      } else if(o.type === 'shield'){
        player.shield = 7;
        floatText(o.x, o.y, 'SHIELD', '#8ef');
        sfx('power');
      } else if(o.type === 'rapid'){
        player.rapid = 8;
        floatText(o.x, o.y, 'RAPID', '#ff8');
        sfx('power');
      } else if(o.type === 'multi'){
        player.multi = 9;
        floatText(o.x, o.y, 'MULTI', '#f8f');
        sfx('power');
      } else if(o.type === 'life'){
        if(lives < 6){
          lives++;
          floatText(o.x, o.y, '+1 NYAWA', '#6f6');
          sfx('life');
        } else {
          score += 100;
          floatText(o.x, o.y, '+100', '#8f8');
          sfx('orb');
        }
      }
      spawnPart(o.x, o.y, '#66aaff', 9, 100);
      updateHUD();
    } else if(o.y > H+20 || o.life <= 0){
      orbs.splice(i, 1);
    }
  }

  for(let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }

  for(let i = floatTexts.length-1; i >= 0; i--){
    const f = floatTexts[i];
    f.y += f.vy * dt;
    f.life -= dt;
    if(f.life <= 0) floatTexts.splice(i, 1);
  }

  const nl = 1 + Math.floor(score / 700);
  if(nl > level){
    level = nl;
    waveAnnounce = 2.2;
    spawnPart(W/2, H/2, '#00ffcc', 35, 220, 4);
    sfx('level');
    msgEl.textContent = 'LEVEL ' + level + ' !';
    setTimeout(()=>{ if(state==='play') msgEl.textContent = 'Semakin cepat...'; }, 2000);
  }

  score += dt * 5;
  updateHUD();
}

// ===== DRAW =====
function draw(){
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-0.5)*shake*12, (Math.random()-0.5)*shake*9);

  ctx.fillStyle = '#060a15';
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(0,90,130,0.12)';
  ctx.lineWidth = 1;
  for(let x=0;x<W;x+=30){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=30){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  stars.forEach(s=>{
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#c8e8ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;

  orbs.forEach(o=>{
    let col = '#4af';
    if(o.type==='shield') col = '#6ef';
    else if(o.type==='rapid') col = '#ff5';
    else if(o.type==='multi') col = '#f6f';
    else if(o.type==='life') col = '#5f8';
    const g = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,11);
    g.addColorStop(0,'#fff'); g.addColorStop(0.45,col); g.addColorStop(1,'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x,o.y,11,0,7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(o.x,o.y,3.5,0,7); ctx.fill();
  });

  enemies.forEach(e=>{
    ctx.save();
    ctx.translate(e.x, e.y);
    if(e.type === 'ebullet'){
      ctx.fillStyle = '#f55';
      ctx.beginPath(); ctx.arc(0,0,5,0,7); ctx.fill();
      ctx.fillStyle = '#faa';
      ctx.beginPath(); ctx.arc(0,0,2,0,7); ctx.fill();
    } else if(e.type === 'tank'){
      ctx.fillStyle = '#e22';
      ctx.beginPath(); ctx.moveTo(0,-e.h/2); ctx.lineTo(e.w/2,e.h/2); ctx.lineTo(-e.w/2,e.h/2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#f88'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#222'; ctx.fillRect(-14, -e.h/2-11, 28, 5);
      ctx.fillStyle = '#0d8'; ctx.fillRect(-14, -e.h/2-11, 28*(e.hp/e.maxHp), 5);
    } else if(e.type === 'zig'){
      ctx.fillStyle = '#fa0';
      ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(9,0); ctx.lineTo(0,9); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#fc6'; ctx.lineWidth = 1.5; ctx.stroke();
    } else if(e.type === 'shooter'){
      ctx.fillStyle = '#c2f';
      ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
      ctx.strokeStyle = '#e8f'; ctx.lineWidth = 1.5; ctx.strokeRect(-e.w/2,-e.h/2,e.w,e.h);
      ctx.fillStyle = '#f4f'; ctx.fillRect(-4, e.h/2-2, 8, 6);
    } else {
      ctx.fillStyle = '#e25';
      ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
      ctx.strokeStyle = '#f68'; ctx.lineWidth = 1.5; ctx.strokeRect(-e.w/2,-e.h/2,e.w,e.h);
    }
    ctx.restore();
  });

  bullets.forEach(b=>{
    const g = ctx.createLinearGradient(b.x, b.y-7, b.x, b.y+7);
    g.addColorStop(0,'#fff'); g.addColorStop(0.5,'#0ef'); g.addColorStop(1,'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  });

  if(state === 'play' || state === 'pause'){
    ctx.save();
    ctx.translate(player.x, player.y);
    if(invuln > 0 && Math.floor(invuln*10)%2 === 0) ctx.globalAlpha = 0.3;

    if(player.shield > 0){
      ctx.strokeStyle = `rgba(100,220,255,${0.35 + Math.sin(performance.now()/120)*0.2})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,0,22,0,7); ctx.stroke();
    }

    ctx.shadowColor = '#00e0ff';
    ctx.shadowBlur = 14;

    ctx.fillStyle = '#00e4ff';
    ctx.beginPath();
    ctx.moveTo(0,-17); ctx.lineTo(13,13); ctx.lineTo(0,5); ctx.lineTo(-13,13); ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#bff';
    ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,3); ctx.lineTo(-5,3); ctx.closePath(); ctx.fill();

    const flick = Math.sin(performance.now()/40)*3;
    ctx.fillStyle = player.rapid > 0 ? '#ff6' : '#f6a';
    ctx.beginPath(); ctx.moveTo(-5,11); ctx.lineTo(0,20+flick); ctx.lineTo(5,11); ctx.closePath(); ctx.fill();

    if(player.multi > 0 || level >= 4){
      ctx.fillStyle = '#f8f';
      ctx.fillRect(-15,6,4,4); ctx.fillRect(11,6,4,4);
    }
    ctx.restore();
  }

  particles.forEach(p=>{
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*(p.life/p.max), 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;

  floatTexts.forEach(f=>{
    ctx.globalAlpha = Math.min(1, f.life*2);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 13px Orbitron';
    ctx.textAlign = 'center';
    ctx.fillText(f.txt, f.x, f.y);
  });
  ctx.globalAlpha = 1;

  if(waveAnnounce > 0){
    ctx.fillStyle = `rgba(0,255,200,${Math.min(1, waveAnnounce)})`;
    ctx.font = 'bold 26px Orbitron';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + level, W/2, H/2 - 20);
  }

  if(state === 'menu' || state === 'pause' || state === 'over'){
    ctx.fillStyle = 'rgba(0,4,12,0.75)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    if(state === 'menu'){
      ctx.fillStyle = '#00e8ff'; ctx.font = 'bold 26px Orbitron';
      ctx.fillText('NEON VORTEX', W/2, H/2 - 50);
      ctx.fillStyle = '#9cf'; ctx.font = '13px Orbitron';
      ctx.fillText('Tekan MULAI untuk bermain', W/2, H/2);
      ctx.fillText('← → gerak   TEMBAK / Spasi', W/2, H/2 + 28);
      ctx.fillStyle = '#6ab'; ctx.font = '11px Orbitron';
      ctx.fillText('Ambil power-up: Shield • Rapid • Multi • Nyawa', W/2, H/2 + 56);
    } else if(state === 'pause'){
      ctx.fillStyle = '#00e5ff'; ctx.font = 'bold 30px Orbitron';
      ctx.fillText('JEDA', W/2, H/2);
    } else {
      ctx.fillStyle = '#ff4466'; ctx.font = 'bold 28px Orbitron';
      ctx.fillText('GAME OVER', W/2, H/2 - 36);
      ctx.fillStyle = '#fff'; ctx.font = '17px Orbitron';
      ctx.fillText('Skor: ' + Math.floor(score), W/2, H/2 + 4);
      if(isNewRecord){
        ctx.fillStyle = '#0fa';
        ctx.fillText('★ REKOR BARU! ★', W/2, H/2 + 36);
      }
    }
  }
  ctx.restore();
}

function loop(t){
  const dt = Math.min(0.033, (t - lastTime)/1000);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ===== INPUT =====
function setKey(k, v){
  keys[k] = v;
  const m = {left:'btn-left', right:'btn-right', fire:'btn-fire'};
  if(m[k]) document.getElementById(m[k]).classList.toggle('active', !!v);
}
function bindHold(id, key){
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); setKey(key, 1); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => el.addEventListener(ev, () => setKey(key, 0)));
}
bindHold('btn-left','left');
bindHold('btn-right','right');
bindHold('btn-fire','fire');

document.getElementById('btn-pause').onclick = ()=>{
  if(state === 'play'){ state = 'pause'; msgEl.textContent = 'Dijeda'; }
  else if(state === 'pause'){ state = 'play'; msgEl.textContent = 'Lanjut!'; }
};
document.getElementById('btn-start').onclick = reset;

document.addEventListener('keydown', e=>{
  if(e.code === 'ArrowLeft' || e.code === 'KeyA') setKey('left', 1);
  if(e.code === 'ArrowRight' || e.code === 'KeyD') setKey('right', 1);
  if(e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp'){ e.preventDefault(); setKey('fire', 1); }
  if(e.code === 'KeyP' || e.code === 'Escape'){
    if(state === 'play') state = 'pause';
    else if(state === 'pause') state = 'play';
  }
  if(e.code === 'Enter' && (state === 'menu' || state === 'over')) reset();
});
document.addEventListener('keyup', e=>{
  if(e.code === 'ArrowLeft' || e.code === 'KeyA') setKey('left', 0);
  if(e.code === 'ArrowRight' || e.code === 'KeyD') setKey('right', 0);
  if(e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') setKey('fire', 0);
});

// Start game loop (menu state)
updateHUD();
requestAnimationFrame(loop);

// PWA Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed', err));
  });
}
</script>
